name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and test
        shell: pwsh
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          go test ./...
          go vet ./...
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build and package explicit public files
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          & './scripts/package-release.ps1' -Version $version

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: RoyaleScout-Windows-x64
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "Royale Scout $env:GITHUB_REF_NAME"
