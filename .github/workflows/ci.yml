name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        shell: pwsh
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=high

      - name: Test backend
        run: go test ./...

      - name: Vet backend
        run: go vet ./...

      - name: Check reachable Go vulnerabilities
        shell: pwsh
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

      - name: Verify no distributable secrets are tracked
        shell: pwsh
        run: |
          $forbidden = git ls-files | Where-Object {
            $_ -match '(^|/)(config\.local\.json|credentials\.bin)$' -or
            $_ -match '\.(db|db-wal|db-shm)$'
          }
          if ($forbidden) {
            $forbidden | Write-Error
            throw 'Local secrets or runtime data are tracked.'
          }
